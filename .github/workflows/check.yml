name: Check
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/checkout@v7
        with:
          repository: ryro-hq/syrox
          ref: 3f58af4cffe6eeef5cf6a78705f15bdc17ff9474
          path: syrox-server
      - name: Build pinned language server
        working-directory: syrox-server
        run: cargo build --locked -p syrox --bin srx
      - name: Install OpenCode V2 host
        run: npm install --global @opencode/cli@2.0.12
      - run: npm run check
        env:
          SRX_BIN: ${{ github.workspace }}/syrox-server/target/debug/srx
      - name: Exercise packaged plugin in OpenCode V2
        run: npm run test:host
        env:
          SRX_BIN: ${{ github.workspace }}/syrox-server/target/debug/srx
          OPENCODE_BIN: opencode
